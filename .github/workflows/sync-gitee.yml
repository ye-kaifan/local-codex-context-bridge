name: Sync Gitee

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-gitee
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ye-kaifan/local-codex-context-bridge' && github.event.deleted != true && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Push main and version tags to Gitee
        shell: bash
        env:
          GITEE_SYNC_TOKEN: ${{ secrets.GITEE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GITEE_SYNC_TOKEN" ]]; then
            echo 'GITEE_SYNC_TOKEN is not configured' >&2
            exit 1
          fi

          # Git prompts through this helper; the token never enters a URL or command argument.
          umask 077
          askpass=$(mktemp "$RUNNER_TEMP/gitee-askpass.XXXXXX")
          cat >"$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *sername*) printf '%s\n' oauth2 ;;
            *assword*) printf '%s\n' "$GITEE_SYNC_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          export GIT_TERMINAL_PROMPT=0

          workdir=$(mktemp -d "$RUNNER_TEMP/gitee-repo.XXXXXX")
          git -C "$workdir" init --quiet
          git -C "$workdir" remote add github \
            https://github.com/ye-kaifan/local-codex-context-bridge.git
          git -C "$workdir" fetch --quiet --no-tags github \
            refs/heads/main:refs/remotes/github/main \
            'refs/tags/v*:refs/tags/v*'

          refspecs=(refs/remotes/github/main:refs/heads/main)
          while IFS= read -r tag_ref; do
            # Actions' v* filter does not match '/'; Git refspec wildcards can.
            tag_name=${tag_ref#refs/tags/}
            [[ "$tag_name" == v* && "$tag_name" != */* ]] || continue
            refspecs+=("$tag_ref:$tag_ref")
          done < <(git -C "$workdir" for-each-ref \
            --format='%(refname)' 'refs/tags/v*')
          GIT_ASKPASS="$askpass" git -C "$workdir" push \
            https://gitee.com/ye-kaifan/local-codex-context-bridge.git \
            "${refspecs[@]}"

          echo "Synced main $(git -C "$workdir" rev-parse refs/remotes/github/main) and $((${#refspecs[@]} - 1)) version tag(s)"
